kind = "web"
previewPath = "/"
title = "Tagore Global School"
version = "1.0.0"

[[services]]
localPort = 22306
name = "web"
paths = ["/"]

[services.development]
run = "PORT=22306 pnpm --filter @workspace/tagore-school run dev"

[services.production]
serve = "static"

[services.production.build]
args = ["pnpm", "--filter", "@workspace/tagore-school", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"
PORT = "22306"
BASE_PATH = "/"
